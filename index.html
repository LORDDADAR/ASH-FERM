<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7efdf">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="АШ ФЕРМ">
  <title>АШ ФЕРМ</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./game.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <span class="brand"><img src="./icon-192.png" alt=""> АШ ФЕРМ</span>
      <div class="balance"><span aria-hidden="true">●</span> <strong id="coins">0</strong><span class="sr"> монет</span></div>
    </div>
  </header>
  <main class="wrap">
    <section class="hero">
      <div class="hero-art" aria-hidden="true"><span class="art art-barn"></span><span class="art art-market"></span></div>
      <div class="hero-copy"><h1>АШ ФЕРМ</h1><p>Рынок и развитие фермы</p></div>
    </section>
    <nav class="farm-nav" aria-label="Разделы фермы">
      <a href="#field-title">Поле</a><a href="#market-panel">Рынок</a><a href="#barn-panel">Амбар</a><a href="#upgrades-panel">Улучшения</a>
    </nav>
    <p id="tutorial" class="tutorial" hidden></p>
    <div class="layout">
      <div class="farm">
        <section aria-labelledby="field-title">
          <div class="heading"><h2 id="field-title">Грядки</h2><span id="open-beds"></span></div>
          <p class="hint">Выберите семена и коснитесь свободной грядки.</p>
          <div id="seeds" class="seeds" aria-label="Выбор семян"></div>
          <div id="beds" class="beds"></div>
        </section>
        <section class="animals-section" aria-labelledby="animals-title">
          <div class="heading"><h2 id="animals-title">Животные</h2></div>
          <div id="animals" class="animals"></div>
        </section>
      </div>
      <aside aria-label="Запасы и заказы">
        <section class="panel" id="market-panel"><header class="panel-heading"><span class="art art-market" aria-hidden="true"></span><div><h2>Рынок</h2><span id="order-count"></span></div></header><p id="market-progress"></p><div id="orders"></div></section>
        <section class="panel" id="barn-panel"><header class="panel-heading"><span class="art art-barn" aria-hidden="true"></span><h2>Амбар</h2></header><div id="storage"></div></section>
        <section class="panel" id="upgrades-panel"><header class="panel-heading"><span class="art art-can" aria-hidden="true"></span><h2>Улучшения</h2></header><div id="upgrades"></div></section>
        <details class="panel" id="seed-shop"><summary>Лавка семян</summary><div id="shop"></div></details>
      </aside>
    </div>
    <footer><span id="offline" role="status" hidden>● Можно играть офлайн</span><span id="save-note">Прогресс хранится на этом устройстве</span></footer>
  </main>
  <div id="notice" role="status"></div>
</body>
</html>
